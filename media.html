<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media - Percoustix</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .poster { position: relative; }
    .video-thumbs {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      z-index: 10;
      max-width: 95%;
      width: 95%;
    }
    .video-thumbs a {
      display: block;
      width: 170px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid rgba(47,211,255,0.5);
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .video-thumbs a:hover {
      transform: scale(1.08);
      border-color: #2fd3ff;
      box-shadow: 0 6px 25px rgba(47,211,255,0.4);
    }
    .video-thumbs img {
      width: 100%;
      height: auto;
      display: block;
    }
    @media (max-width: 768px) {
      .video-thumbs {
        top: 22%;
        gap: 8px;
        max-width: 95%;
      }
      .video-thumbs a {
        width: 140px;
      }
    }
  </style>
</head>
