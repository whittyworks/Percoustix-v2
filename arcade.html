<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tap the Pads · Percoustix Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --cyan: #2fd3ff; --magenta: #ff0ad5; --white: #ffffff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--white);
      background-color: #02020a;
      background-image:
        radial-gradient(circle at 65% 25%, rgba(47,211,255,.12), rgba(0,0,0,0) 55%),
        linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,.85));
      min-height: 100vh;
    }
    .container { width: min(1100px, calc(100% - 44px)); margin: 0 auto; }
    .demo-hero {
      padding: 100px 0 80px;
      min-height: calc(100vh - 60px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .section-title-big {
      text-align: center;
      margin: 0 0 16px;
      font-family: "Bebas Neue", Inter, sans-serif;
      font-size: clamp(48px, 10vw, 100px);
      letter-spacing: 6px;
      text-transform: uppercase;
      text-shadow: 0 10px 30px rgba(0,0,0,.85);
    }
    .demo-subtitle {
      max-width: 720px;
      margin: 0 auto 40px;
      text-align: center;
      font-size: 18px;
      opacity: .9;
    }
    .demo-layout {
      display: grid;
      grid-template-columns: 1.5fr .9fr;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 980px) {
      .demo-layout { grid-template-columns: 1fr; }
      .demo-hero { padding: 80px 0 60px; }
    }
    .demo-stage {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.25);
      box-shadow: 0 20px 70px rgba(0,0,0,.60);
    }
    .demo-img { width: 100%; height: auto; display: block; }
    .hotspot {
      position: absolute;
      left: var(--x);
      top: var(--y);
      transform: translate(-50%, -50%);
      width: var(--size, 80px);
      height: var(--size, 80px);
      border-radius: 50%;
      background: rgba(47,211,255,.15);
      border: 2px solid rgba(47,211,255,.6);
      cursor: pointer;
      padding: 0;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(47,211,255,.4), 0 0 40px rgba(47,211,255,.2);
    }
    .hotspot::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(47,211,255,.3);
      animation: pulse-ring 2s ease-out infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    .hotspot:hover {
      background: rgba(47,211,255,.25);
      border-color: rgba(47,211,255,.9);
    }
    .hotspot.is-active {
      background: rgba(255,10,213,.3) !important;
      border-color: rgba(255,10,213,.8) !important;
      box-shadow: 0 0 30px rgba(255,10,213,.6), 0 0 60px rgba(255,10,213,.3) !important;
    }
    .hotspot-soundhole {
      background: rgba(255,200,0,.1);
      border-color: rgba(255,200,0,.5);
      box-shadow: 0 0 20px rgba(255,200,0,.3);
    }
    .hotspot-soundhole::before { border-color: rgba(255,200,0,.3); }
    .hotspot-soundhole.is-playing {
      background: rgba(0,255,100,.25) !important;
      border-color: rgba(0,255,100,.8) !important;
      box-shadow: 0 0 30px rgba(0,255,100,.5) !important;
      animation: playing-pulse 0.48s ease-in-out infinite;
    }
    @keyframes playing-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.05); }
    }
    .demo-panel {
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.45);
      box-shadow: 0 20px 70px rgba(0,0,0,.55);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 30px;
    }
    @media (max-width: 980px) { .demo-panel { position: relative; top: auto; } }
    .demo-panel-inner { padding: 24px; }
    .demo-panel-kicker {
      font-family: Orbitron, Inter, sans-serif;
      color: rgba(47,211,255,.95);
      letter-spacing: 1.5px;
      font-size: 12px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .demo-panel-title {
      margin: 0 0 14px;
      font-family: "Bebas Neue", Inter, sans-serif;
      font-size: 36px;
      letter-spacing: 1px;
    }
    .demo-panel-body { margin: 0 0 16px; opacity: .92; line-height: 1.6; }
    .demo-panel-hint { opacity: .75; font-size: 13px; }
    .demo-panel-hint strong { color: var(--cyan); }
    .sound-controls {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(47,211,255,.2);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .sound-control-group { display: flex; flex-direction: column; gap: 8px; }
    .sound-label {
      font-family: Orbitron, Inter, sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(47,211,255,.95);
    }
    .sound-label-gold { color: rgba(255,200,0,.95); }
    .sound-select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0,0,0,.5);
      border: 1px solid rgba(47,211,255,.3);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    .sound-select:focus { outline: none; border-color: rgba(47,211,255,.8); }
    .sound-select option { background: #111; }
    .sound-select-gold { border-color: rgba(255,200,0,.3); }
    .sound-select-gold:focus { border-color: rgba(255,200,0,.8); }
  </style>
</head>

    </div>
  </section>

  <audio id="audio-kick" preload="auto" src="https://cdn.freesound.org/previews/171/171104_2394245-lq.mp3"></audio>
  <audio id="audio-snare" preload="auto" src="https://cdn.freesound.org/previews/270/270156_5765281-lq.mp3"></audio>
  <audio id="audio-hihat" preload="auto" src="https://cdn.freesound.org/previews/250/250547_4770646-lq.mp3"></audio>
  <audio id="audio-tom" preload="auto" src="https://cdn.freesound.org/previews/209/209879_3797507-lq.mp3"></audio>
  <audio id="audio-bongo" preload="auto" src="https://cdn.freesound.org/previews/584/584341_7367060-lq.mp3"></audio>
  <audio id="audio-guitar" preload="auto" loop src="https://cdn.freesound.org/previews/470/470467_9159316-lq.mp3"></audio>
  <audio id="audio-latin" preload="auto" loop src="https://cdn.freesound.org/previews/353/353279_4490673-lq.mp3"></audio>

  <script>
    var audioElements = {
      kick: document.getElementById('audio-kick'),
      snare: document.getElementById('audio-snare'),
      hihat: document.getElementById('audio-hihat'),
      tom: document.getElementById('audio-tom'),
      bongo: document.getElementById('audio-bongo'),
      guitar: document.getElementById('audio-guitar'),
      latin: document.getElementById('audio-latin')
    };
    
    var volumeLevels = { kick: 0.5, snare: 0.8, hihat: 0.8, tom: 1.0, bongo: 0.8 };
    Object.values(audioElements).forEach(function(audio) { audio.load(); });
    
    function playDrumSound(name) {
      var original = audioElements[name];
      if (!original) return;
      var clone = original.cloneNode();
      clone.volume = volumeLevels[name] || 1.0;
      clone.play().catch(function(e) { console.log('Audio play failed:', e); });
      clone.addEventListener('ended', function() { clone.remove(); });
    }
    
    var audioCtx = null, riffInterval = null, riffStep = 0;
    
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    
    function playPowerChord(rootFreq, duration, volume, muted) {
      initAudio();
      var t = audioCtx.currentTime;
      var vol = volume * (muted ? 0.08 : 0.15);
      var decay = muted ? duration * 0.5 : duration;
      [1, 1.5, 2].forEach(function(mult, i) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = muted ? 'square' : 'sawtooth';
        osc.frequency.value = rootFreq * mult;
        gain.gain.setValueAtTime(vol * (i === 0 ? 1 : 0.7), t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + decay);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + decay + 0.1);
      });
    }
    
    var rockRiff = [
      { note: 82, dur: 0.2, vol: 1.0, muted: true },
      { note: 82, dur: 0.15, vol: 0.7, muted: true },
      { note: 82, dur: 0.2, vol: 0.9, muted: true },
      { note: 98, dur: 0.25, vol: 1.0, muted: false },
      { note: 82, dur: 0.2, vol: 1.0, muted: true },
      { note: 82, dur: 0.15, vol: 0.6, muted: true },
      { note: 110, dur: 0.25, vol: 0.95, muted: false },
      { note: 98, dur: 0.2, vol: 0.8, muted: false },
      { note: 82, dur: 0.2, vol: 1.0, muted: true },
      { note: 98, dur: 0.15, vol: 0.7, muted: true },
      { note: 110, dur: 0.2, vol: 0.85, muted: true },
      { note: 123, dur: 0.3, vol: 1.0, muted: false },
      { note: 110, dur: 0.2, vol: 0.9, muted: false },
      { note: 98, dur: 0.2, vol: 0.85, muted: false },
      { note: 82, dur: 0.25, vol: 1.0, muted: false },
      { note: 82, dur: 0.15, vol: 0.5, muted: true }
    ];
    
    function playRiffNote() {
      if (!guitarPlaying) return;
      var note = rockRiff[riffStep];
      playPowerChord(note.note, note.dur, note.vol, note.muted);
      riffStep = (riffStep + 1) % rockRiff.length;
    }
    
    function startRockRiff() { initAudio(); riffStep = 0; playRiffNote(); riffInterval = setInterval(playRiffNote, 180); }
    function stopRockRiff() { if (riffInterval) { clearInterval(riffInterval); riffInterval = null; } }
    
    var guitarPlaying = false, currentLoop = null;
    var loopVolumes = { guitar: 1.0, latin: 0.3 };
    
    function startAudioLoop(audioEl, name) {
      audioEl.currentTime = 0;
      audioEl.volume = loopVolumes[name] || 1.0;
      audioEl.play().catch(function(e) { console.log('Audio play failed:', e); });
      currentLoop = audioEl;
    }
    
    function stopAudioLoop() { if (currentLoop) { currentLoop.pause(); currentLoop.currentTime = 0; currentLoop = null; } }
    
    var guitarSelect = document.getElementById('guitarSound');
    var riffNames = { acoustic: 'Acoustic strum', rock: 'Rock riff', latin: 'Latin groove' };
    
    function startGuitar() {
      if (guitarPlaying) return;
      guitarPlaying = true;
      var mode = guitarSelect.value;
      if (mode === 'acoustic') startAudioLoop(audioElements.guitar, 'guitar');
      else if (mode === 'latin') startAudioLoop(audioElements.latin, 'latin');
      else if (mode === 'rock') startRockRiff();
      document.querySelector('.hotspot-soundhole').classList.add('is-playing');
    }
    
    function stopGuitar() {
      guitarPlaying = false;
      stopAudioLoop();
      stopRockRiff();
      document.querySelector('.hotspot-soundhole').classList.remove('is-playing');
    }
    
    var hotspots = document.querySelectorAll('.hotspot');
    var bodyEl = document.getElementById('demoBody');
    var leftSelect = document.getElementById('leftPadSound');
    var rightSelect = document.getElementById('rightPadSound');
    
    function playDrum(padType) { playDrumSound(padType === 'left' ? leftSelect.value : rightSelect.value); }
    function flash(el) { el.classList.add('is-active'); setTimeout(function() { el.classList.remove('is-active'); }, 200); }
    
    hotspots.forEach(function(hs) {
      hs.addEventListener('click', function(e) {
        e.preventDefault();
        var self = this;
        if (self.classList.contains('hotspot-soundhole')) {
          if (guitarPlaying) { stopGuitar(); bodyEl.textContent = 'Guitar stopped. Tap to play again!'; }
          else { startGuitar(); bodyEl.textContent = riffNames[guitarSelect.value] + ' playing! Add some drums!'; }
        } else {
          var pad = self.getAttribute('data-pad');
          playDrum(pad);
          flash(self);
          var name = pad === 'left' ? leftSelect.options[leftSelect.selectedIndex].text : rightSelect.options[rightSelect.selectedIndex].text;
          bodyEl.textContent = name + '!';
        }
      });
      hs.addEventListener('touchstart', function(e) { e.preventDefault(); this.click(); });
    });
    
    guitarSelect.addEventListener('change', function() { if (guitarPlaying) { stopGuitar(); startGuitar(); } });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft' || e.key === 'a') playDrum('left');
      else if (e.key === 'ArrowRight' || e.key === 'd') playDrum('right');
      else if (e.key === ' ') { e.preventDefault(); guitarPlaying ? stopGuitar() : startGuitar(); }
    });
    window.addEventListener('beforeunload', stopGuitar);
  </script>
</body>
</html>
